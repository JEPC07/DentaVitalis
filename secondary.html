<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">
    <title>DentaVitalis</title>

    <!-- Custom fonts for this template-->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet" type="text/css"> 
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">

    <!-- Custom styles for this template-->
    <link href="css/sb-admin-2.min.css" rel="stylesheet">
    <link href="style-secondary.css" rel="stylesheet">
    <link href="calendar.css" rel="stylesheet">
</head>

<body id="page-top">
    <div id="wrapper">
        <!-- Barra de navegación superior con título -->
        <nav class="navbar navbar-expand static-top" id="topBarNav">
            <h1 class="navbar-brand"><i class="fas fa-tooth"></i> DentaVitalis</h1>
            <button class="btn-logout" id="logoutButton" title="Cerrar sesión">
                <i class="fas fa-lock"></i>
            </button>
        </nav>

        <!-- Barra de navegación lateral (sin el título) -->
        <nav id="topNav">
            <div class="button-container">
                <button class="nav-button active" onclick="location.href='secondary.html'">
                    <i class="fas fa-home"></i> INICIO
                </button>
                <button class="nav-button" onclick="location.href='crear_historia_clinica.html'">
                    <i class="fas fa-user-md"></i> CREAR HISTORIA
                </button>
                <button class="nav-button" onclick="location.href='inventario_de_materiales.html'">
                    <i class="fas fa-boxes"></i> INVENTARIO
                </button>
                <button class="nav-button" onclick="location.href='caja.html'">
                    <i class="fas fa-cash-register"></i> CAJA
                </button>
                <button class="nav-button" onclick="location.href='busqueda_de_pacientes.html'">
                    <i class="fas fa-search"></i> HISTORIAS
                </button>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main-container">
            <div class="calendar-and-panel-container">
                <div id="calendar-container">
                    <div id="calendar-header">
                        <div id="calendar-header-left">
                            <button id="prevMonth">&lt;</button>
                            <h2 id="monthYear"></h2>
                            <button id="nextMonth">&gt;</button>
                        </div>
                        <div id="view-selector">
                            <button id="monthView" class="view-button active">Mes</button>
                            <button id="weekView" class="view-button">Semana</button>
                            <button id="dayView" class="view-button">Día</button>
                        </div>
                    </div>
                    <table id="calendar">
                        <thead>
                            <tr>
                                <th>Dom</th>
                                <th>Lun</th>
                                <th>Mar</th>
                                <th>Mié</th>
                                <th>Jue</th>
                                <th>Vie</th>
                                <th>Sáb</th>
                            </tr>
                        </thead>
                        <tbody id="calendar-body">
                        </tbody>
                    </table>
                </div>
                <div id="side-panel">
                    <h3 class="panel-title">Eventos de Hoy</h3>
                    <div class="event-list">
                        <!-- Los eventos se agregarán dinámicamente aquí -->
                        <p class="no-events">No hay eventos programados para hoy.</p>
                    </div>
                    <button id="add-event" class="btn-add-event">
                        <i class="fas fa-plus"></i> Agregar Evento
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- Scroll to Top Button-->
    <a class="scroll-to-top rounded" href="#page-top">
        <i class="fas fa-angle-up"></i>
    </a>

    <!-- Bootstrap core JavaScript-->
    <script src="vendor/jquery/jquery.min.js"></script>
    <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

    <!-- Core plugin JavaScript-->
    <script src="vendor/jquery-easing/jquery.easing.min.js"></script>

    <!-- Custom scripts for all pages-->
    <script src="js/sb-admin-2.min.js"></script>

    <script>
        document.getElementById('logoutButton').addEventListener('click', function() {
            localStorage.clear();
            window.location.href = 'index.html';
        });
    </script>
    <script src="calendar.js"></script>
</body>

</html>
