<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DentaVitalis</title>
    <link rel="stylesheet" href="style.css">
    <!-- Enlace a Google Fonts para usar "Lora" y "Open Sans" -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@400;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>
<body>
    <div class="split-container">
        <div class="left-side">
        </div>
        <div class="right-side">
            <div class="content-container">
                <div class="logo-container">
                    <h1 class="overlay-text" id="welcome-text">
                        <span class="welcome-message">Bienvenido a DentaVitalis</span>
                    </h1>
                    <img src="logo2.png" alt="Logo DentaVitalis" class="animated-logo">
                    <div class="logo-shadow"></div>
                </div>
                <div class="login-container hidden" id="login-container">
                    <div class="close-button" id="close-login">&#8592;</div>
                    <form id="login-form">
                        <div class="input-group">
                            <input type="password" id="password" name="password" required>
                            <label for="password">Ingrese la contraseña</label>
                            <i class="fas fa-lock"></i>
                        </div>
                        <button type="submit" class="btn">Ingresar</button>
                        <p id="error-message" class="hidden">Contraseña incorrecta</p>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        const welcomeText = document.getElementById('welcome-text');
        const loginContainer = document.getElementById('login-container');
        const closeLogin = document.getElementById('close-login');

        const welcomeMessages = [
            "Bienvenido a DentaVitalis",
            "Welcome to DentaVitalis",
            "Benvenuti in DentaVitalis",
            "Bem-vindo à DentaVitalis",
            "Bienvenue chez DentaVitalis"
        ];
        let currentMessageIndex = 0;
        let intervalId;

        function changeWelcomeMessage() {
            const welcomeSpan = welcomeText.querySelector('.welcome-message');
            welcomeSpan.style.opacity = 0;
            
            setTimeout(() => {
                currentMessageIndex = (currentMessageIndex + 1) % welcomeMessages.length;
                welcomeSpan.textContent = welcomeMessages[currentMessageIndex];
                welcomeSpan.style.opacity = 1;
            }, 500); // Espera 500ms antes de cambiar el texto y hacerlo visible de nuevo
        }

        function startChangingMessage() {
            intervalId = setInterval(changeWelcomeMessage, 3000);
        }

        function stopChangingMessage() {
            clearInterval(intervalId);
        }

        startChangingMessage();

        welcomeText.addEventListener('click', function() {
            loginContainer.classList.remove('hidden');
            this.classList.add('hidden');
            stopChangingMessage();
        });

        closeLogin.addEventListener('click', function() {
            loginContainer.classList.add('hidden');
            welcomeText.classList.remove('hidden');
            startChangingMessage();
        });

        document.getElementById('login-form').addEventListener('submit', function(event) {
            event.preventDefault();
            var password = document.getElementById('password').value;
            if (password === 'vitalis1') { // Cambia 'vitalis1' por la contraseña que desees
                window.location.href = "secondary.html";
            } else {
                document.getElementById('error-message').classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
